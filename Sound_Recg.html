<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sound Recognizer</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: #172033;
      background: #eef4ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(114, 156, 255, 0.35), transparent 36%),
        linear-gradient(135deg, #f7f9ff 0%, #e8f0ff 100%);
    }

    .container {
      width: min(100%, 500px);
      padding: 42px 40px;
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(45, 73, 130, 0.18);
    }

    h2 {
      margin: 0 0 10px;
      color: #16264d;
      font-size: clamp(1.6rem, 4vw, 2rem);
      letter-spacing: -0.03em;
    }

    .container::before {
      content: "♪";
      display: grid;
      width: 58px;
      height: 58px;
      margin: 0 auto 20px;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, #5b7cfa, #8058d8);
      border-radius: 18px;
      font-size: 1.8rem;
      box-shadow: 0 10px 22px rgba(91, 124, 250, 0.3);
    }

    .container h2 + input {
      margin-top: 22px;
    }

    input[type="file"] {
      width: 100%;
      padding: 10px;
      color: #65708a;
      background: #f7f9fe;
      border: 1px dashed #b7c4e2;
      border-radius: 12px;
      font-size: 0.92rem;
    }

    input[type="file"]::file-selector-button {
      margin-right: 12px;
      padding: 9px 14px;
      color: #fff;
      background: #617ff1;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    input[type="file"]::file-selector-button:hover {
      background: #4d69d2;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px 20px;
      color: #fff;
      background: linear-gradient(135deg, #5b7cfa, #7658d8);
      border: 0;
      border-radius: 10px;
      box-shadow: 0 8px 18px rgba(91, 124, 250, 0.25);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(91, 124, 250, 0.32);
    }

    button:active {
      transform: translateY(0);
    }

    button:focus-visible,
    input[type="file"]:focus-visible {
      outline: 3px solid rgba(91, 124, 250, 0.35);
      outline-offset: 3px;
    }

    #result {
      min-height: 24px;
      margin-top: 24px;
      padding: 14px 16px;
      color: #425170;
      background: #f5f7fc;
      border-radius: 10px;
      font-weight: 600;
      line-height: 1.6;
    }

    #result:empty {
      display: none;
    }

    @media (max-width: 480px) {
      .container {
        padding: 32px 22px;
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Upload any sound file</h2>
    <input type="file" id="audioInput" accept="audio/*">
    <br>
    <button onclick="uploadAudio()">Predict Sound</button>

    <div id="result"></div>
  </div>
  <script>
    async function uploadAudio() {
      const fileInput = document.getElementById('audioInput');
      const resultDiv = document.getElementById('result');
      if (fileInput.files.length === 0) {
        alert("Please select an audio file first.");
        return;
      }
      const file = fileInput.files[0];
      resultDiv.innerText = "Processing audio...";
      const formData = new FormData();
      formData.append("file", file);

      try {
        const response = await fetch("http://localhost:8000/predict", {
          method: "POST",
          body: formData
        });
        if (!response.ok) {
          throw new Error("Server error: " + response.statusText);
        }
        const data = await response.json();
        resultDiv.innerHTML = `
          Prediction: <b>${data.prediction}</b><br>
          Confidence: <b>${(data.confidence * 100).toFixed(2)}%</b>`;
      } catch (error) {
        resultDiv.innerText = "Error uploading file: " + error.message;
      }
    }
  </script>
</body>
</html>
